services:
  - type: web
    name: mosaic-outcome-compiler
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mosaic-db
          property: connectionString
      - key: NODE_VERSION
        value: '22'
      - key: DEMO_MODE
        value: 'true'
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_ENABLED
        value: 'true'
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: ZAPIER_WEBHOOK_URL
        sync: false

databases:
  - name: mosaic-db
    databaseName: mosaic
    user: mosaic
    plan: free
